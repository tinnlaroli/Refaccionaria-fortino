# PostgreSQL tuning para VPS con 2 GB RAM
# Copiar a: /etc/postgresql/16/main/conf.d/tuning.conf
# Ajusta shared_buffers si tu VPS tiene más RAM:
#   1GB → shared_buffers = 128MB
#   2GB → shared_buffers = 256MB
#   4GB → shared_buffers = 512MB

# Memory
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 4MB
huge_pages = off

# SSD / I/O
random_page_cost = 1.1
effective_io_concurrency = 200

# Planificador
default_statistics_target = 100

# Conexiones (bajo tráfico, negocio pequeño)
max_connections = 30

# WAL (reduce IO en SSD)
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Autovacuum (necesario para tablas de ventas)
autovacuum_max_workers = 2
autovacuum_naptime = 1min
