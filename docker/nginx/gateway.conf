resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  # Landing — sitio público
  location / {
    set $upstream_landing landing;
    proxy_pass http://$upstream_landing:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # POS — punto de venta
  location /pos/ {
    set $upstream_pos pos;
    proxy_pass http://$upstream_pos:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /pos {
    return 301 /pos/;
  }

  # API — backend (sin path en proxy_pass: reenvía URI completa /api/...)
  location /api/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location = /health {
    set $upstream_api api;
    proxy_pass http://$upstream_api:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
