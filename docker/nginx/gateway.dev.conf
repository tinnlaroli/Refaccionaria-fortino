# Gateway de desarrollo — proxy a Vite (HMR) y API con recarga en caliente
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  # Landing — Vite dev (puerto 5174)
  location / {
    set $upstream_landing landing;
    proxy_pass http://$upstream_landing:5174;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # POS — Vite dev (puerto 5173, base /pos/)
  location /pos/ {
    set $upstream_pos pos;
    proxy_pass http://$upstream_pos:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location = /pos {
    return 301 /pos/;
  }

  location /api/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location = /health {
    set $upstream_api api;
    proxy_pass http://$upstream_api:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
