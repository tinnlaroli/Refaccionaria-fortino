# Alias de desarrollo — equivalente a docker compose up (usa docker-compose.override.yml).
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    volumes:
      - ./api/src:/app/src
      - ./bd:/app/db
    environment:
      NODE_ENV: development
    command: npm run dev:docker

  pos:
    build:
      context: ./ux
      dockerfile: Dockerfile.dev
    volumes:
      - ./ux:/app
      - pos_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_HMR_CLIENT_PORT: "8080"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile.dev
    volumes:
      - ./landing:/app
      - landing_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_HMR_CLIENT_PORT: "8080"
    command: npm run dev -- --host 0.0.0.0 --port 5174

  gateway:
    volumes:
      - ./docker/nginx/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pos_node_modules:
  landing_node_modules:
