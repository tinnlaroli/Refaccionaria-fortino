services:
  postgres:
    image: postgres:16
    container_name: refaccionaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refaccionaria
      POSTGRES_PASSWORD: refaccionaria_dev
      POSTGRES_DB: refaccionaria
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refaccionaria -d refaccionaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: refaccionaria-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://refaccionaria:refaccionaria_dev@postgres:5432/refaccionaria
    depends_on:
      postgres:
        condition: service_healthy

  pos:
    build:
      context: ./apps/pos
    container_name: refaccionaria-pos
    restart: unless-stopped
    depends_on:
      - api

  landing:
    build:
      context: ./apps/landing
    container_name: refaccionaria-landing
    restart: unless-stopped
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    container_name: refaccionaria-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - pos
      - landing

volumes:
  postgres_data:
