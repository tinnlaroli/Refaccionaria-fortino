# Refaccionaria Fortino — stack unificado
#
# Producción (build estático + nginx):
#   docker compose up -d --build
#
# Desarrollo (recarga automática, sin rebuild por cada edit):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   # primera vez o tras cambiar package.json
#
# URLs: http://localhost:8080  ·  POS http://localhost:8080/pos/  ·  Admin http://localhost:8080/pos/app

services:
  postgres:
    image: postgres:16
    container_name: refaccionaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refaccionaria
      POSTGRES_PASSWORD: refaccionaria_dev
      POSTGRES_DB: refaccionaria
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refaccionaria -d refaccionaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./bd
      dockerfile: Dockerfile
    container_name: refaccionaria-migrate
    environment:
      DATABASE_URL: postgresql://refaccionaria:refaccionaria_dev@postgres:5432/refaccionaria
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./bd
      dockerfile: Dockerfile
    container_name: refaccionaria-seed
    environment:
      DATABASE_URL: postgresql://refaccionaria:refaccionaria_dev@postgres:5432/refaccionaria
    command: ["npm", "run", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: refaccionaria-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://refaccionaria:refaccionaria_dev@postgres:5432/refaccionaria
      JWT_SECRET: refaccionaria-dev-secret-change-me
    depends_on:
      seed:
        condition: service_completed_successfully

  pos:
    build:
      context: ./ux
    container_name: refaccionaria-pos
    restart: unless-stopped
    depends_on:
      - api

  landing:
    build:
      context: ./landing
    container_name: refaccionaria-landing
    restart: unless-stopped
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    container_name: refaccionaria-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - pos
      - landing

volumes:
  postgres_data:
