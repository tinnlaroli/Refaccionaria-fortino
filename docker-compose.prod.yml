# Override de producción — usar con:
#   cp .env.example .env   # editar secretos
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Anula docker-compose.override.yml (dev/HMR). Requiere .env con POSTGRES_PASSWORD, JWT_SECRET, etc.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refaccionaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-refaccionaria}

  migrate:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refaccionaria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-refaccionaria}

  seed:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refaccionaria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-refaccionaria}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refaccionaria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-refaccionaria}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    command: null
    volumes: []
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pos:
    build:
      context: ./ux
    command: null
    environment: {}
    volumes: []

  landing:
    build:
      context: ./landing
    command: null
    environment: {}
    volumes: []

  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
